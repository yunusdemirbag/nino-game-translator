# Linux sunucusu (apps/linux, .NET 10): testler. Ortak çekirdek apps/windows/src altından gelir.
# Docker imajı ayrı iş akışındadır: linux-docker.yml (elle başlatılır, ghcr.io'ya yayınlar).
name: linux

on:
  push:
    paths:
      - "apps/linux/**"
      - "apps/windows/src/**"
      - "apps/windows/native/**"
      - "apps/windows/Directory.Build.props"
      - "apps/tv-web/**"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "apps/linux/**"
      - "apps/windows/src/**"
      - "apps/windows/native/**"
      - "apps/windows/Directory.Build.props"
      - "apps/tv-web/**"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: NuGet önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('apps/linux/**/*.csproj', 'apps/windows/src/**/*.csproj', 'apps/*/Directory.Build.props') }}
          restore-keys: nuget-linux-
      - name: Testler
        run: dotnet test apps/linux/Nino.Linux.slnx --logger "trx;LogFilePrefix=linux" --results-directory "${{ runner.temp }}/test-results"
      - name: Test sonuçları
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-sonuclari
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
