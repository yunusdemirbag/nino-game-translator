#
# Nino Game Translator, iPhone ve iPad uygulaması. Proje dosyası XcodeGen ile üretilir:
#   cd apps/ios && xcodegen generate
# Çekirdek deponun core/ klasöründedir (NinoCore). Yolu NINO_CORE ortam değişkeniyle değiştirilebilir;
# verilmezse scripts/generate.sh core/ klasörünü (yoksa ~/Desktop/NinoCore) kullanır.
name: Nino
options:
  bundleIdPrefix: com.ninotranslator
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "4.5.0"
    CURRENT_PROJECT_VERSION: "29"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  NinoCore:
    path: ${NINO_CORE}
  NinoRemotePlay:
    path: ${NINO_CORE}/NinoRemotePlay
  # Xbox ev yayını (Beta): Google libwebrtc'nin hazır iOS derlemesi (BSD-3-Clause).
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 150.0.0
targets:
  Nino:
    type: application
    platform: iOS
    sources:
      - path: Nino
        excludes:
          - Resources/fonts
      # Altyazı yazı tipleri (SIL OFL, lisanslarıyla); pakette "fonts" klasörü olarak durur.
      - path: Nino/Resources/fonts
        type: folder
        buildPhase: resources
      - path: Config
        buildPhase: none
      # Lisans ve üçüncü taraf bildirimi (uygulamayla birlikte dağıtılır).
      - path: ../../NOTICE
        buildPhase: resources
    # Telefondan TV kurulumu: Samsung (.wgt) ve LG (.ipk) paketleri kaynaktan üretilip pakete konur (internetsiz).
    postCompileScripts:
      - name: TV packages
        script: python3 "$SRCROOT/scripts/tv-packages.py" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: NinoCore
      - package: NinoRemotePlay
      - package: WebRTC
        product: WebRTC
    info:
      path: Nino/Info.plist
      properties:
        CFBundleDisplayName: Nino Game Translator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, tr, ar, hi, id, th, vi, ur, bn, ms, fil, nl]
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Nino talks to your PS5 and TV over your home network: it reads the subtitles, sends their translation to the TV, and sets up or updates the Nino app on the TV."
        NSBonjourServices: [_nino._tcp]
        # WebRTC kitaplığı kamera ve mikrofon arayüzleriyle gelir. Nino ikisini de açmaz; Xbox sesi çalarken iOS
        # ses birimi için mikrofon izni sorulabilir.
        NSMicrophoneUsageDescription: Nino doesn't record or send your voice. The Xbox streaming library may ask for this while it plays the game sound here. You can say no and you'll still hear the game.
        NSCameraUsageDescription: Nino never turns on the camera. The library used for Xbox streaming comes with camera features that Nino leaves unused.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
    entitlements:
      path: Nino/Nino.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninotranslator.ios
        PRODUCT_NAME: Nino
        PRODUCT_MODULE_NAME: Nino
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  NinoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NinoTests
    dependencies:
      - target: Nino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninotranslator.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nino.app/Nino"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Nino:
    build:
      targets:
        Nino: all
        NinoTests: [test]
    test:
      targets:
        - NinoTests
