<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Barlow+Condensed:wght@600;700&family=Nunito:wght@600;700&display=swap">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: geometricPrecision; }
  #stage { position: fixed; left: 0; right: 0; bottom: 7%; display: flex; justify-content: center; pointer-events: none; }
  #line {
    max-width: 84vw; padding: 0.25em 0.6em; border-radius: 0.3em; box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 600; font-size: 48px; line-height: 1.3;
    color: #FFFFFF; text-align: center; white-space: pre-wrap; overflow-wrap: anywhere;
    text-shadow: 0 0 0.12em #000, 0 0.06em 0.12em #000; background: rgba(0, 0, 0, 0.6);
    opacity: 0; transition: opacity 0.15s;
  }
  #line.on { opacity: 1; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 7%; text-align: center; pointer-events: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 600; font-size: 28px;
    color: rgba(255, 255, 255, 0.85); text-shadow: 0 0 0.15em #000, 0 0.05em 0.15em #000; display: none;
  }
  .area {
    position: fixed; padding: 0.3em 0.6em; border-radius: 0.3em; box-sizing: border-box; pointer-events: none;
    font-weight: 600; line-height: 1.25; white-space: pre-wrap; overflow-wrap: anywhere;
    text-shadow: 0 0 0.12em #000, 0 0.06em 0.12em #000;
  }
</style>
</head>
<body>
<div id="stage"><div id="line"></div></div>
<div id="hint"></div>
<script>
(function () {
  "use strict";
  var MAX_LINE = 42, MAX_LINES = 3, MIN_SCALE = 0.75;
  var NAMED = { green: "#00FF00", black: "#000000", magenta: "#FF00FF", blue: "#0000FF" };
  var COLORS = { white: "#FFFFFF", yellow: "#FFE135" };
  var SYSTEM = 'system-ui, -apple-system, "Segoe UI", sans-serif';
  var FAMILIES = { modern: '"Barlow", ' + SYSTEM, condensed: '"Barlow Condensed", ' + SYSTEM, rounded: '"Nunito", ' + SYSTEM, system: SYSTEM };
  var ARABIC = /[ؠ-يٮ-ۓۺ-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/;

  var q = new URLSearchParams(location.search);
  function number(v) { if (v === null || v.trim() === "") return null; var n = Number(v); return isFinite(n) ? n : null; }
  var sizeParam = number(q.get("size"));
  var bottomParam = number(q.get("bottom"));
  var bgRaw = q.get("bg");
  var dimParam = bgRaw === null ? null : number(bgRaw);
  var named = dimParam === null && bgRaw ? NAMED[bgRaw.toLowerCase()] || null : null;
  if (named) dimParam = null;
  var hintParam = q.get("hint");
  var inObs = typeof window.obsstudio !== "undefined" || /OBS\//.test(navigator.userAgent);
  var hintOn = hintParam === "1" ? true : hintParam === "0" ? false : !inObs;
  var turkish = /^tr/i.test(navigator.language || "");

  var stage = document.getElementById("stage");
  var line = document.getElementById("line");
  var hint = document.getElementById("hint");
  if (named) document.body.style.background = named;

  var style = {}, base = 48, placement = "cover", color = COLORS.white, family = SYSTEM, weight = 600;
  var dim = null, lastMode = "fixed", hideTimer = null, hintTimer = null, areas = {}, opened = false;

  function pageHeight() { return window.innerHeight || 1080; }
  function scaled(s) { return Math.max(8, Math.round(s * pageHeight() / 1080)); }
  function inRange(v) { return typeof v === "number" && v >= 0 && v <= 85; }

  function showHint(text) {
    if (!hintOn) return;
    hint.textContent = text;
    hint.style.display = "block";
    clearTimeout(hintTimer);
    hintTimer = setTimeout(hideHint, 12000);
  }
  function hideHint() { clearTimeout(hintTimer); hint.style.display = "none"; }

  function boxBackground() {
    if (typeof dim === "number") {
      var a = Math.max(0, Math.min(1, dim / 100));
      if (named) a = a > 0 ? 1 : 0;
      return "rgba(0, 0, 0, " + a + ")";
    }
    return named ? "rgba(0, 0, 0, 1)" : "rgba(0, 0, 0, 0.6)";
  }

  function applyStyle(s) {
    style = s || {};
    var size = sizeParam !== null ? sizeParam : typeof style.fontSize === "number" ? style.fontSize : 48;
    if (size > 0) base = size;
    hint.style.fontSize = Math.max(20, Math.round(scaled(base) * 0.6)) + "px";
    var bottom = bottomParam !== null ? bottomParam : style.bottomPercent;
    if (inRange(bottom)) {
      hint.style.bottom = bottom + "%";
      if (lastMode === "fixed") stage.style.bottom = bottom + "%";
    }
    dim = dimParam !== null ? dimParam : typeof style.background === "number" ? style.background : null;
    line.style.background = boxBackground();
    weight = style.bold ? 700 : 600;
    line.style.fontWeight = weight;
    if (COLORS[style.textColor]) color = COLORS[style.textColor];
    line.style.color = color;
    family = FAMILIES[style.font] || SYSTEM;
    line.style.fontFamily = family;
    placement = style.placement || "cover";
    Object.keys(areas).forEach(function (id) { styleArea(areas[id].el, areas[id].box); });
  }

  // Satır kaydırma: en çok 42 karakter, 3 satır, ölçek en az 0.75; konuşan adı ilk satırda kalır.
  function wrap(text) {
    var length = Array.from(text).length;
    if (length <= MAX_LINE || text.indexOf("\n") >= 0) return { text: text, scale: 1 };
    var words = text.split(/\s+/).filter(function (w) { return w.length > 0; });
    var parts = words.slice();
    for (var i = 0; i < Math.min(3, words.length); i++) {
      if (/[:：]$/.test(words[i])) {
        var end = Math.min(i + 1, words.length - 1);
        parts = [words.slice(0, end + 1).join(" ")].concat(words.slice(end + 1));
        break;
      }
    }
    if (parts.length < 2) return { text: text, scale: 1 };
    var scale = Math.min(1, Math.max(MIN_SCALE, MAX_LINE * MAX_LINES / length));
    var limit = Math.floor(MAX_LINE / scale);
    var count = Math.min(MAX_LINES, Math.max(2, Math.ceil(length / limit)), parts.length);
    function width(a, b) { var w = 0; for (var k = a; k < b; k++) w += parts[k].length; return w + (b - a - 1); }
    var best = null;
    function consider(cuts) {
      var widths = [], from = 0;
      cuts.concat([parts.length]).forEach(function (c) { widths.push(width(from, c)); from = c; });
      var longest = Math.max.apply(null, widths);
      var squares = widths.reduce(function (s, w) { return s + w * w; }, 0);
      if (!best || longest < best.longest || (longest === best.longest && squares < best.squares))
        best = { cuts: cuts, longest: longest, squares: squares };
    }
    if (count === 2) {
      for (var a = 1; a < parts.length; a++) consider([a]);
    } else {
      for (var x = 1; x < parts.length - 1; x++) for (var y = x + 1; y < parts.length; y++) consider([x, y]);
    }
    var lines = [], start = 0;
    best.cuts.concat([parts.length]).forEach(function (c) { lines.push(parts.slice(start, c).join(" ")); start = c; });
    return { text: lines.join("\n"), scale: scale };
  }

  function resetPosition() {
    stage.style.top = ""; stage.style.left = "0"; stage.style.right = "0"; stage.style.bottom = "7%";
    stage.style.height = ""; stage.style.width = "";
    line.style.position = ""; line.style.left = ""; line.style.top = ""; line.style.transform = "";
    line.style.width = ""; line.style.minWidth = ""; line.style.maxWidth = "";
  }

  function hide() { line.classList.remove("on"); }

  function showSubtitle(d) {
    clearTimeout(hideTimer);
    var text = d && typeof d.text === "string" ? d.text : "";
    if (!text) { hide(); return; }
    hideHint();
    var w = wrap(text);
    var box = d.box && typeof d.box === "object" ? d.box : null;
    var mode = box && bottomParam === null ? placement : "fixed";
    if (mode !== "cover" && mode !== "above" && mode !== "below") mode = "fixed";

    resetPosition();
    applyStyle(style);
    line.textContent = w.text;
    line.style.fontSize = Math.max(8, Math.round(scaled(base) * w.scale)) + "px";
    line.dir = ARABIC.test(text) ? "rtl" : "";

    if (mode === "cover") {
      stage.style.top = "0"; stage.style.bottom = "0"; stage.style.left = "0"; stage.style.right = "0";
      line.style.position = "absolute";
      var band = style.backgroundShape === "band";
      var cx = band ? 50 : (box.left + box.right) / 2 * 100;
      var cy = (box.top + box.bottom) / 2 * 100;
      line.style.left = cx + "%";
      line.style.top = cy + "%";
      line.style.transform = "translate(-50%, -50%)";
      if (band) { line.style.width = "100vw"; line.style.maxWidth = "100vw"; }
      else line.style.minWidth = Math.max(0, box.right - box.left) * 100 + "vw";
      if (named) line.style.background = "rgba(0, 0, 0, 1)";
      else if (typeof dim === "number") line.style.background = dim >= 100 ? "rgba(0, 0, 0, 1)" : "rgba(0, 0, 0, " + Math.max(0, dim / 100) + ")";
      else line.style.background = "rgba(0, 0, 0, 0.97)";
    } else if (mode === "above" || mode === "below") {
      var H = pageHeight(), gap = H * 0.012;
      var c = (box.left + box.right) / 2, h = Math.max(0.3, Math.min(c, 1 - c));
      stage.style.left = Math.max(0.02, c - h) * 100 + "%";
      stage.style.right = Math.max(0.02, 1 - c - h) * 100 + "%";
      var height = line.getBoundingClientRect().height;
      var fitsAbove = height <= box.top * H - gap;
      var fitsBelow = height <= (1 - box.bottom) * H - gap;
      if (mode === "above" && !fitsAbove) mode = fitsBelow ? "below" : "fixed";
      else if (mode === "below" && !fitsBelow) mode = fitsAbove ? "above" : "fixed";
      if (mode === "above") { stage.style.bottom = (1 - box.top) * 100 + 1.2 + "%"; }
      else if (mode === "below") { stage.style.bottom = ""; stage.style.top = box.bottom * 100 + 1.2 + "%"; }
    }
    if (mode === "fixed") {
      stage.style.left = "0"; stage.style.right = "0"; stage.style.top = "";
      var bottom = bottomParam !== null ? bottomParam : style.bottomPercent;
      stage.style.bottom = (inRange(bottom) ? bottom : 7) + "%";
    }
    lastMode = mode;
    line.classList.add("on");
    var duration = typeof d.duration === "number" && d.duration > 0 ? d.duration : 8000;
    hideTimer = setTimeout(hide, Math.max(1000, duration));
  }

  function styleArea(el, box) {
    el.style.background = named ? "rgba(0, 0, 0, 1)" : "rgba(0, 0, 0, 0.85)";
    el.style.color = color;
    el.style.fontFamily = family;
    el.style.fontSize = Math.max(12, scaled(base) * 0.55) + "px";
    if (box) {
      el.style.left = box.left * 100 + "%"; el.style.top = box.top * 100 + "%"; el.style.transform = "";
      el.style.minWidth = Math.max(0, box.right - box.left) * 100 + "vw";
      el.style.maxWidth = Math.max(box.right - box.left, Math.min(0.45, 1 - box.left)) * 100 + "vw";
    } else {
      el.style.left = "50%"; el.style.top = "4%"; el.style.transform = "translateX(-50%)";
      el.style.minWidth = ""; el.style.maxWidth = "60vw";
    }
  }

  function showArea(d) {
    var id = d && d.id !== undefined && d.id !== null ? String(d.id) : "";
    if (!id) return;
    var text = typeof d.text === "string" ? d.text : "";
    if (!text) {
      if (areas[id]) { areas[id].el.remove(); delete areas[id]; }
      return;
    }
    hideHint();
    var entry = areas[id];
    if (!entry) {
      var el = document.createElement("div");
      el.className = "area";
      document.body.appendChild(el);
      entry = areas[id] = { el: el, box: null };
    }
    entry.box = d.box && typeof d.box === "object" ? d.box : null;
    entry.el.textContent = text;
    styleArea(entry.el, entry.box);
  }

  function clearAreas() {
    Object.keys(areas).forEach(function (id) { areas[id].el.remove(); });
    areas = {};
  }

  function parse(e) { try { return JSON.parse(e.data); } catch (x) { return null; } }

  applyStyle({});
  showHint(turkish ? "Nino: altyazı bekleniyor" : "Nino: waiting for subtitles");
  window.addEventListener("resize", function () { applyStyle(style); });

  var source = new EventSource("/events?viewer=obs");
  source.onopen = function () { opened = true; };
  source.onerror = function () {
    if (!opened) showHint(turkish ? "Nino uygulamasına bağlanılamadı" : "Cannot reach the Nino app");
  };
  source.addEventListener("style", function (e) { var d = parse(e); if (d) applyStyle(d); });
  source.addEventListener("subtitle", function (e) { var d = parse(e); if (d) showSubtitle(d); });
  source.addEventListener("clear", function () { clearTimeout(hideTimer); hide(); });
  source.addEventListener("region", function (e) { var d = parse(e); if (d) showArea(d); });
  source.addEventListener("region-clear", clearAreas);
})();
</script>
</body>
</html>
