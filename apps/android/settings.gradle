pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    resolutionStrategy {
        eachPlugin {
            // Kotlin JVM eklentisi, Android eklentisiyle aynı Kotlin paketinden gelir.
            if (requested.id.id == 'org.jetbrains.kotlin.jvm') useModule('org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21')
        }
    }
}
dependencyResolutionManagement { repositories { google(); mavenCentral() } }
rootProject.name = 'nino-android'
include ':core', ':app'
