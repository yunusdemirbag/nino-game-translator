<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- SPDX-License-Identifier: AGPL-3.0-only -->
  <!-- Nino: kurulum yardımcısının karakteri ("Nino robotu"), animasyonlu: süzülür, el sallar, etrafa bakar, göz kırpar. Büyük yuvarlak kafa, küçük oyuncak gövde, iri parlak gözler,
       ay yıldızlı kırmızı şapka. Logonun renkleri: lacivert yüz ekranı, beyaz kabuk, mavi ışık. Sıfırdan çizildi.
       Animasyonlu sürüm: nino-bot-animated.svg; göz kırpma karesi: nino-bot-blink.svg. -->
  <style>
    /* Hepsi 4,8 saniyelik döngüye bölünür (GIF'e kusursuz döner). */
    .float  { animation: float 2.4s ease-in-out infinite; transform-origin: 128px 230px; }
    .wave   { animation: wave 2.4s ease-in-out infinite; transform-origin: 176px 214px; transform-box: view-box; }
    .look   { animation: look 4.8s ease-in-out infinite; }
    .eyes   { animation: blink 4.8s infinite; transform-origin: 128px 140px; transform-box: view-box; }
    .cap    { animation: cap 2.4s ease-in-out infinite; transform-origin: 128px 92px; transform-box: view-box; }
    .bubble { animation: pulse 2.4s ease-in-out infinite; transform-origin: 160px 18px; transform-box: view-box; }
    .ring   { animation: ring 2.4s ease-in-out infinite; }
    .shadow { animation: shadow 2.4s ease-in-out infinite; transform-origin: 128px 244px; transform-box: view-box; }
    @keyframes float { 0%,100% { transform: translateY(0) scale(1, 1) } 45% { transform: translateY(-9px) scale(0.99, 1.01) } 90% { transform: translateY(1px) scale(1.02, 0.98) } }
    @keyframes wave { 0%,100% { transform: rotate(0deg) } 15% { transform: rotate(-140deg) } 28% { transform: rotate(-112deg) } 41% { transform: rotate(-145deg) } 54% { transform: rotate(-112deg) } 70% { transform: rotate(0deg) } }
    @keyframes look { 0%,20% { transform: translateX(0) } 30%,45% { transform: translateX(-6px) } 55%,70% { transform: translateX(6px) } 80%,100% { transform: translateX(0) } }
    @keyframes blink { 0%,86%,90%,100% { transform: scaleY(1) } 88% { transform: scaleY(0.08) } }
    @keyframes cap { 0%,100% { transform: rotate(0deg) } 25% { transform: rotate(-3deg) } 75% { transform: rotate(3deg) } }
    @keyframes pulse { 0%,100% { transform: scale(1) translateY(0) } 50% { transform: scale(1.1) translateY(-3px) } }
    @keyframes ring { 0%,100% { opacity: .5 } 50% { opacity: .2 } }
    @keyframes shadow { 0%,100% { transform: scale(1); opacity: .15 } 45% { transform: scale(0.85); opacity: .09 } }
    @media (prefers-reduced-motion: reduce) { .float, .wave, .look, .eyes, .cap, .bubble, .ring, .shadow { animation: none } }
  </style>
  <defs>
    <radialGradient id="shell" cx="0.4" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#EEF2F8"/>
      <stop offset="1" stop-color="#CBD4E3"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2A55"/>
      <stop offset="1" stop-color="#090F22"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#E6F3FF"/>
      <stop offset="0.4" stop-color="#6FB6FF"/>
      <stop offset="1" stop-color="#2463FF"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF2A35"/>
      <stop offset="1" stop-color="#C8000E"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4000F"/>
      <stop offset="1" stop-color="#8E000A"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D9BFF"/>
      <stop offset="1" stop-color="#1F5CFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0A1124" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Yerdeki gölge ve mavi halka -->
  <ellipse class="shadow" cx="128" cy="244" rx="46" ry="7" fill="#0A1124" opacity="0.15"/>
  <ellipse class="ring" cx="128" cy="168" rx="108" ry="26" fill="none" stroke="#2D8CFF" stroke-width="4" opacity="0.5" filter="url(#glow)"/>

  <g class="float" filter="url(#soft)">
    <!-- Küçük gövde ve kollar -->
    <ellipse cx="128" cy="214" rx="38" ry="26" fill="url(#shell)"/>
    <ellipse cx="86" cy="206" rx="12" ry="17" fill="#DCE3EE" transform="rotate(25 86 206)"/>

    <circle cx="128" cy="212" r="7" fill="#2D8CFF" filter="url(#glow)"/>

    <!-- Büyük yuvarlak kafa -->
    <ellipse cx="128" cy="128" rx="92" ry="80" fill="url(#shell)"/>
    <!-- Kulaklar: mavi ışıklı -->
    <circle cx="36" cy="134" r="13" fill="#DCE3EE"/>
    <circle cx="36" cy="134" r="6" fill="#5AA6FF" filter="url(#glow)"/>
    <circle cx="220" cy="134" r="13" fill="#DCE3EE"/>
    <circle cx="220" cy="134" r="6" fill="#5AA6FF" filter="url(#glow)"/>
    <!-- Yüz ekranı -->
    <ellipse cx="128" cy="140" rx="70" ry="52" fill="url(#visor)"/>
    <path d="M78 118 C100 104 150 102 178 114" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5" stroke-linecap="round"/>

    <!-- İri gözler -->
    <g class="look"><g class="eyes" filter="url(#glow)">
      <ellipse cx="100" cy="140" rx="17" ry="21" fill="url(#eye)"/>
      <ellipse cx="156" cy="140" rx="17" ry="21" fill="url(#eye)"/>
      <circle cx="106" cy="131" r="6" fill="#FFFFFF"/>
      <circle cx="162" cy="131" r="6" fill="#FFFFFF"/>
      <circle cx="96" cy="150" r="2.5" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="152" cy="150" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    </g></g>
    <!-- Gülümseme ve yanaklar -->
    <path d="M118 170 Q128 178 138 170" fill="none" stroke="#6FB6FF" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="74" cy="164" rx="9" ry="5.5" fill="#FF7A9A" opacity="0.5"/>
    <ellipse cx="182" cy="164" rx="9" ry="5.5" fill="#FF7A9A" opacity="0.5"/>

    <!-- El sallayan sağ kol (kafanın önünde) -->
    <g class="wave">
      <rect x="172" y="206" width="38" height="18" rx="9" fill="#E3E9F2" transform="rotate(35 176 214)"/>
      <circle cx="207" cy="236" r="11" fill="#F4F7FB" stroke="#D3DAE6" stroke-width="2"/>
    </g>
    <g class="cap">
    <!-- Şapka: kırmızı, önünde ay yıldız, siperlik öne bakar -->
    <path d="M52 92 C54 38 202 38 204 92 C170 82 86 82 52 92 Z" fill="url(#cap)"/>
    <path d="M128 52 C128 44 128 40 128 40" stroke="#B8000D" stroke-width="2"/>
    <path d="M90 52 C100 46 112 44 118 44" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="5" stroke-linecap="round"/>
    <!-- Ay yıldız -->
    <circle cx="122" cy="68" r="12" fill="#FFFFFF"/>
    <circle cx="125.5" cy="68" r="9.6" fill="#E30A17"/>
    <path transform="translate(140.5 68) rotate(-90)" d="M0 -6 L1.76 -2.43 L5.71 -1.85 L2.85 0.93 L3.53 4.85 L0 3 L-3.53 4.85 L-2.85 0.93 L-5.71 -1.85 L-1.76 -2.43 Z" fill="#FFFFFF"/>
    <!-- Siperlik -->
    <path d="M46 92 C80 80 176 80 210 92 C200 104 56 104 46 92 Z" fill="url(#brim)"/>
    <!-- Tepe düğmesi ve anten -->
    <circle cx="128" cy="42" r="6" fill="#C8000E"/>
    <path d="M128 38 C128 28 132 22 140 18" fill="none" stroke="#C9D2E1" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Antenin ucunda çeviri balonu -->
  <g class="bubble">
    <g transform="translate(140 0)">
      <rect x="0" y="0" width="42" height="30" rx="10" fill="url(#bubble)"/>
      <path d="M9 29 L5 38 L17 30 Z" fill="#2563FF"/>
      <text x="21" y="21.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
            font-size="15" font-weight="700" fill="#FFFFFF">文A</text>
    </g>
  </g>
</svg>
